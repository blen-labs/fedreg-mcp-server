name: release

# Continuous release: EVERY push to main is released. The workflow runs the
# full gates, computes the next SemVer from the conventional commits since
# the last tag (breaking -> major, feat -> minor, everything else -> at
# least a patch; scripts/release.mjs + scripts/release-lib.mjs), stamps
# package.json and the x-release-version source markers, prepends the
# CHANGELOG section, pushes a chore(release) commit with the vX.Y.Z tag,
# creates the GitHub Release, and publishes to npm via trusted publishing
# (OIDC) - no npm token exists anywhere.
#
# No-loop guarantee: the release commit is pushed with GITHUB_TOKEN, and
# GitHub never triggers workflows for GITHUB_TOKEN-initiated events.
# Concurrent-merge safety: if another commit lands on main mid-run, the
# release push is rejected and this run fails; the newer push's run then
# releases both changes together.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish:
        description: 'Recovery only: re-run gates and publish the CURRENT version to npm (no bump, no tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # Belt-and-braces: skip release commits should one ever arrive via a PAT.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commit, tag, GitHub Release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags: the bump is computed from commits since the last tag
      - uses: pnpm/action-setup@v4
      # No registry-url here on purpose: setup-node's generated .npmrc would
      # reference a NODE_AUTH_TOKEN env var that does not exist - publishing
      # authenticates via npm Trusted Publishing (OIDC), configured on the
      # npm package settings for this repo + release.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # isolated-vm needs python + a C++ toolchain to compile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Compute version, stamp files, write CHANGELOG section
        id: cut
        if: ${{ !inputs.republish }}
        run: node scripts/release.mjs
      # Build AFTER stamping so dist/ carries the released version strings.
      - run: pnpm build
      # Prove the artifact exists before tagging or publishing.
      - run: test -f dist/bin.js && test -f dist/index.js && test -f dist/index.d.ts
      - name: Commit, tag, and create the GitHub Release
        if: steps.cut.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cut.outputs.version }}
          NOTES_FILE: ${{ steps.cut.outputs.notes_file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md src/server/mcpServer.ts src/sdk/bindings.ts
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:main --follow-tags
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "${NOTES_FILE}"
      - name: Publish to npm (trusted publishing)
        if: steps.cut.outputs.released == 'true' || inputs.republish
        run: pnpm publish --access public --no-git-checks
