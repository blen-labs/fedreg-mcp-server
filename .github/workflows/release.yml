name: release

# Automated releases: every merge to main updates (or opens) a Release PR via
# release-please, computed from conventional commit messages. Merging that
# Release PR creates the git tag + GitHub Release and triggers the npm publish
# job below. Manual bootstrap: workflow_dispatch runs publish for the current
# checkout's version (used once for v2.0.0, which was tagged by hand).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the default GITHUB_TOKEN, the Release PR triggers no CI runs
      # (GitHub suppresses workflows for GITHUB_TOKEN-raised events). Set the
      # optional RELEASE_PLEASE_TOKEN secret (fine-grained PAT or GitHub App
      # token with contents + pull-requests write) so Release PRs get checks.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Publish when release-please just cut a release, or on manual dispatch
    # from main (bootstrap / recovery). `!cancelled()` (not `always()`) lets
    # the dispatch path run despite the skipped release-please job while still
    # honoring a cancel of an in-flight run.
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      # Pin to the tag release-please just created; on the dispatch path the
      # output is empty and checkout falls back to the dispatched ref (main).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v4
      # No registry-url here on purpose: setup-node's generated .npmrc would
      # reference ${NODE_AUTH_TOKEN}, which no longer exists — publishing
      # authenticates via npm Trusted Publishing (OIDC), configured on the
      # npm package settings for this repo + release.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # isolated-vm needs python + a C++ toolchain to compile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Prove the artifact exists before publishing — the tarball's dist/ only
      # comes from prepack, and a missing dist would otherwise ship an empty,
      # unrunnable package.
      - run: test -f dist/bin.js && test -f dist/index.js && test -f dist/index.d.ts
      # Tokenless: pnpm detects the Actions OIDC context and exchanges it for
      # a short-lived npm credential; provenance is generated automatically
      # for trusted-publisher publishes.
      - run: pnpm publish --access public --no-git-checks
