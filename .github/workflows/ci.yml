name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # isolated-vm needs python + a C++ toolchain to compile.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      # Deno so the fallback sandbox runner is actually exercised (its tests
      # gate on availability and silently no-op without a runner).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  conventional-commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release pipeline computes versions and the CHANGELOG from
      # conventional commit subjects, so non-conforming subjects are a build
      # error, not a style nit. Merge commits are exempt (the release script
      # skips them too).
      - name: Validate commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$BASE..$HEAD_SHA"
          elif git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            RANGE="$BEFORE..$HEAD_SHA"
          else
            RANGE="$(git describe --tags --abbrev=0)..$HEAD_SHA"
          fi
          echo "checking $RANGE"
          git log --no-merges --format='%s' "$RANGE" \
            | { grep -vE '^(feat|fix|docs|chore|ci|test|refactor|perf|build|style|revert)(\([^)]*\))?!?: .' || true; } > /tmp/bad-subjects
          if [ -s /tmp/bad-subjects ]; then
            echo "Non-conventional commit subjects found:"
            cat /tmp/bad-subjects
            echo "Format: type(scope)?: description  (types: feat fix docs chore ci test refactor perf build style revert)"
            exit 1
          fi
          echo "all commit subjects conform"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: false
          tags: fedreg-mcp:ci
